<script>
// =====================================================================
//  TalentHub Executive · Adriana Olivos

//  CONFIGURACIÓN: pega aquí los datos de tu proyecto Supabase
//  (Supabase > Project Settings > API). Si se dejan vacíos, el sistema
//  funciona en MODO DEMO (datos solo en este navegador).
// =====================================================================
const SUPABASE_URL = 'https://nybzgiesrscdikclfvvd.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4MHM8aOntYpFs7xCO0YYyA_ZD3lQltw'; // clave pública (segura en el navegador)

// ---------------------------------------------------------------------
const MODE = (SUPABASE_URL && SUPABASE_ANON_KEY) ? 'cloud' : 'demo';
const INITIAL_HASH = location.hash; // se lee antes de que Supabase limpie la URL (recuperación de contraseña)
const sb = (MODE === 'cloud' && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { flowType: 'implicit', persistSession: true, detectSessionInUrl: true } }) : null;
const BUCKET = 'documentos';
const MAX_FILE = 10 * 1024 * 1024;

const DEFAULT_PHASES = ['Filtro Curricular', 'Filtro Telefónico (CUL)', 'Fase 1', 'Fase 2', 'Fase 3 (Checklist)', 'Informe Psicolaboral', 'Entrevista con el Cliente'];
const DEFAULT_STAGES = ['Alineación / Brief', 'Convocatoria Abierta', 'Filtros & Sintonía', 'Evaluaciones Activas', 'Terna Presentada', 'Negociación / Oferta', 'Cerrado & Facturado'];
const CUL_OPTS = ['Pendiente', 'En trámite', 'Sin antecedentes ✓', 'Observado / Descarte'];
const SUNEDU_OPTS = ['Pendiente', 'Registrado ✓', 'No figura', 'Secundaria / Técnico'];
const CALL_OPTS = ['Pendiente', 'Apto (Excelente sintonía)', 'Apto', 'Descarte Salarial', 'No contesta'];
const RATING_OPTS = ['Pendiente', 'Apto', 'Apto con observaciones', 'No apto'];
const STATUS_OPTS = [['activo', 'Activo en proceso'], ['contratado', 'Contratado'], ['descartado', 'Descartado']];
const MODALITY_OPTS = ['Presencial', 'Híbrido', 'Remoto 100%'];
const CONTRACT_OPTS = ['A Plazo Fijo (Sujeto a Modalidad)', 'Indeterminado / Indefinido', 'Por Inicio o Incremento de Actividad', 'Locación de Servicios (RxH / Honorarios)', 'Convenio de Prácticas (Pre/Pro)'];
const PAYROLL_OPTS = ['Planilla General (Régimen Común)', 'Planilla REMYPE (Pequeña Empresa)', 'Planilla REMYPE (Microempresa)', 'Planilla Régimen Agrario', 'Sin Planilla (Honorarios / RxH)'];
const FREQ_OPTS = ['Quincenal y Fin de Mes', 'Mensual', 'Semanal'];
const TPL_CATS = [['Llenado del Postulante', 'Llenado del Postulante (Datos/DDJJ)'], ['Evaluación STAR', 'Guía de Entrevista por Competencias'], ['Referencias Laborales', 'Verificación de Referencias'], ['Carta Oferta', 'Carta Oferta / Incorporación'], ['Otro', 'Otro Formato Operativo']];
const ROLE_LABEL = { admin: 'Administradora', editor: 'Editor', lector: 'Solo lectura', pendiente: 'Pendiente' };
const TABLES = ['processes', 'candidates', 'billing', 'competencies', 'dynamics', 'templates', 'documents', 'activity_log', 'settings'];

const TABS = [
  { id: 'procesos', label: 'Procesos B2B', icon: 'briefcase' },
  { id: 'avance', label: 'Control de Avance', icon: 'list-checks' },
  { id: 'candidatos', label: 'Candidatos', icon: 'users' },
  { id: 'expedientes', label: 'Expedientes & Docs', icon: 'folder-open' },
  { id: 'metricas', label: 'Métricas & KPIs', icon: 'chart-bar' },
  { id: 'finanzas', label: 'Finanzas', icon: 'currency-dollar', admin: true },
  { id: 'competencias', label: 'Diccionario STAR', icon: 'brain' },
  { id: 'assessment', label: 'Assessment Center', icon: 'users-three' },
  { id: 'plantillas', label: 'Plantillas & Fichas', icon: 'clipboard-text' },
  { id: 'admin', label: 'Usuarios & Config.', icon: 'gear', admin: true },
];

// ============================ UTILIDADES ============================
const $ = (id) => document.getElementById(id);
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
}
function todayISO() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function nowISO() { return new Date().toISOString(); }
function addDaysISO(n) { const d = new Date(); d.setDate(d.getDate() + n); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
function toDate(s) {
  if (!s) return null;
  if (s instanceof Date) return isNaN(s) ? null : s;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
  const d = new Date(s); return isNaN(d) ? null : d;
}
function daysSince(s) { const d = toDate(s); if (!d) return 0; return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000)); }
function daysBetween(a, b) { const da = toDate(a), db = toDate(b); if (!da || !db) return null; return Math.round((db - da) / 86400000); }
function fmtDate(s) { const d = toDate(s); return d ? d.toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—'; }
function fmtDateTime(s) { const d = toDate(s); return d ? d.toLocaleString('es-PE', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—'; }
function ageFrom(b) {
  const d = toDate(b); if (!d) return '';
  const t = new Date(); let a = t.getFullYear() - d.getFullYear(); const m = t.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < d.getDate())) a--;
  return a > 0 && a < 120 ? a + ' años' : '';
}
function money(n) { return 'S/ ' + (Number(n) || 0).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function norm(s) { return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }
function safeName(n) { return norm(n).replace(/[^a-z0-9._-]+/g, '_').replace(/_+/g, '_').slice(-80) || 'archivo'; }
function fileSize(n) { n = Number(n) || 0; return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function opts(list, sel) {
  return list.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(sel ?? '') ? 'selected' : ''}>${esc(l)}</option>`; }).join('');
}
function optsWithCurrent(list, sel) { // agrega el valor actual si no está en la lista (datos antiguos)
  const vals = list.map(o => Array.isArray(o) ? o[0] : o);
  return opts(sel && !vals.includes(sel) ? [...list, sel] : list, sel);
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
const baseURL = () => location.href.split('#')[0].split('?')[0];
function readAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  const tone = type === 'error' ? 'bg-rose-600' : type === 'warn' ? 'bg-amber-600' : 'bg-slate-900';
  el.className = `${tone} text-white text-xs font-medium px-4 py-2.5 rounded-lg shadow-lg flex items-start gap-2`;
  el.innerHTML = `<i class="ph-bold ${type === 'error' ? 'ph-warning-circle' : type === 'warn' ? 'ph-warning' : 'ph-check-circle'} text-sm mt-px"></i><span>${esc(msg)}</span>`;
  const root = $('toast-root'); root.appendChild(el);
  while (root.children.length > 3) root.firstElementChild.remove();
  setTimeout(() => el.remove(), type === 'error' ? 7000 : 3500);
}
function err(e) { console.error(e); toast(e?.message || String(e), 'error'); }

// Formularios: helpers de campos
function fInput(id, label, val, o = {}) {
  return `<div class="${o.cls || ''}"><label class="lbl" for="${id}">${label}${o.req ? ' <span class="text-rose-500">*</span>' : ''}</label>
    <input id="${id}" type="${o.type || 'text'}" value="${esc(val ?? '')}" ${o.req ? 'required' : ''} placeholder="${esc(o.ph || '')}" class="inp ${o.icls || ''}" ${o.attrs || ''}></div>`;
}
function fSelect(id, label, list, sel, o = {}) {
  return `<div class="${o.cls || ''}"><label class="lbl" for="${id}">${label}</label><select id="${id}" class="inp ${o.icls || ''}" ${o.attrs || ''}>${o.raw || optsWithCurrent(list, sel)}</select></div>`;
}
function fText(id, label, val, o = {}) {
  return `<div class="${o.cls || ''}"><label class="lbl" for="${id}">${label}${o.req ? ' <span class="text-rose-500">*</span>' : ''}</label>
    <textarea id="${id}" rows="${o.rows || 2}" ${o.req ? 'required' : ''} placeholder="${esc(o.ph || '')}" class="inp ${o.icls || ''}">${esc(val ?? '')}</textarea></div>`;
}
function fCheck(id, label, checked, o = {}) {
  return `<label class="flex items-start gap-2 bg-white p-2 rounded-lg border ${o.border || 'border-slate-200'} cursor-pointer ${o.cls || ''}">
    <input type="checkbox" id="${id}" ${checked ? 'checked' : ''} class="w-4 h-4 mt-0.5 rounded"><span><span class="font-semibold text-slate-700">${label}</span>${o.help ? `<span class="block text-[10px] text-slate-500">${o.help}</span>` : ''}</span></label>`;
}
const val = (id) => ($(id)?.value ?? '').trim();
const chk = (id) => !!$(id)?.checked;

// Modales (se apilan)
function openModal({ title, subtitle = '', body, size = 'max-w-2xl', footer = '' }) {
  const wrap = document.createElement('div');
  wrap.dataset.modal = '1';
  wrap.className = 'fixed inset-0 bg-slate-900/40 z-50 flex items-start md:items-center justify-center p-2 md:p-4';
  wrap.innerHTML = `<div class="bg-white rounded-2xl ${size} w-full shadow-xl border border-slate-200 flex flex-col max-h-[96vh]">
      <div class="flex items-start justify-between gap-3 border-b border-slate-100 px-5 py-3.5">
        <div class="min-w-0"><h3 class="text-sm md:text-base font-bold text-slate-900">${title}</h3>${subtitle ? `<p class="text-xs text-slate-500">${subtitle}</p>` : ''}</div>
        <button data-close class="text-slate-400 hover:text-slate-600 text-xl leading-none" title="Cerrar"><i class="ph ph-x"></i></button>
      </div>
      <div class="overflow-y-auto px-5 py-4 text-xs custom-scrollbar">${body}</div>
      ${footer ? `<div class="px-5 py-3 border-t border-slate-100 flex flex-wrap justify-end gap-2">${footer}</div>` : ''}
    </div>`;
  wrap.close = () => wrap.remove();
  wrap.addEventListener('click', e => { if (e.target.closest('[data-close]')) wrap.close(); });
  $('modal-root').appendChild(wrap);
  return wrap;
}
function closeTopModal() { const r = $('modal-root'); if (r.lastElementChild) r.lastElementChild.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTopModal(); });
async function busy(btnSel, fn) {
  const btns = document.querySelectorAll(btnSel);
  btns.forEach(b => b.disabled = true);
  try { return await fn(); } catch (e) { err(e); } finally { btns.forEach(b => b.disabled = false); }
}
function printHTML(html) { $('print-root').innerHTML = html; setTimeout(() => window.print(), 50); }
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast('Enlace copiado'); } catch (e) { prompt('Copia el enlace:', t); } }

// ======================= MODO DEMO (localStorage) =======================
const DEMO_KEY = 'th_demo_v2', DEMO_FILES = 'th_demo_files_v2';
let DEMO = null;
function demoLoad() {
  try { DEMO = JSON.parse(localStorage.getItem(DEMO_KEY)); } catch (e) { DEMO = null; }
  if (!DEMO || !Array.isArray(DEMO.processes)) { DEMO = demoSeed(); demoSave(); }
  TABLES.forEach(t => { if (!Array.isArray(DEMO[t])) DEMO[t] = []; });
}
function demoSave() { try { localStorage.setItem(DEMO_KEY, JSON.stringify(DEMO)); } catch (e) { toast('No hay espacio en el navegador (modo demo).', 'error'); } }
function demoFiles() { try { return JSON.parse(localStorage.getItem(DEMO_FILES)) || {}; } catch (e) { return {}; } }
const CAND_DEFAULTS = { phase: 1, max_phase: 1, status: 'activo', cul: 'Pendiente', sunedu: 'Pendiente', call_result: 'Pendiente', check_psych: false, check_biocv: false, check_videoref: false, check_callref: false, report_rating: 'Pendiente', client_visible: false, source: 'manual' };

  const cand = (o) => ({ ...CAND_DEFAULTS, id: uid(), created_at: now, updated_at: now, ...o });
  return {

  },
  get_client_view({ p_token }) {

    const cs = DEMO.candidates.filter(c => c.process_id === p.id);

};

// ============================ CAPA DE DATOS ============================
const api = {
  async list(t) {
    if (MODE === 'demo') return JSON.parse(JSON.stringify(DEMO[t] || []));
    const out = [], size = 1000;
    for (let from = 0; ; from += size) {
      let q = sb.from(t).select('*');
      if (t === 'activity_log') q = q.order('created_at', { ascending: false }).limit(500);
      else { if (t !== 'settings') q = q.order('created_at', { ascending: true }); q = q.range(from, from + size - 1); }
      const { data, error } = await q; if (error) throw error;
      out.push(...data);
      if (t === 'activity_log' || data.length < size) break;
    }
    return out;
  },
  async insert(t, rows) {
    const arr = Array.isArray(rows) ? rows : [rows];
    if (MODE === 'demo') {
      const now = nowISO();
      const ins = arr.map(r => ({
        id: uid(), created_at: now,
        ...(t === 'processes' ? { apply_token: uid(), client_token: uid(), updated_at: now, stage_changed_at: now, stage: 1, vacancies_count: 1 } : {}),
        ...(t === 'candidates' ? { ...CAND_DEFAULTS, last_moved_at: now, updated_at: now } : {}),
        ...r,
      }));
      if (t === 'activity_log') DEMO[t].unshift(...ins); else DEMO[t].push(...ins);
      demoSave(); return JSON.parse(JSON.stringify(ins));
    }
    const { data, error } = await sb.from(t).insert(arr).select(); if (error) throw error; return data;
  },
  async update(t, id, patch) {
    if (MODE === 'demo') {
      const row = DEMO[t].find(r => r.id === id); if (!row) throw new Error('Registro no encontrado');
      Object.assign(row, patch); if ('updated_at' in row) row.updated_at = nowISO(); demoSave(); return JSON.parse(JSON.stringify(row));
    }
    if (['processes', 'candidates'].includes(t)) patch = { ...patch, updated_at: nowISO() };
    const { data, error } = await sb.from(t).update(patch).eq('id', id).select(); if (error) throw error;
    if (!data || !data.length) throw new Error('No tienes permiso para modificar este registro.');
    return data[0];
  },
  async remove(t, id) {
    if (MODE === 'demo') { DEMO[t] = DEMO[t].filter(r => r.id !== id); demoSave(); return; }
    const { error } = await sb.from(t).delete().eq('id', id); if (error) throw error;
  },
  async removeMany(t, ids) {
    if (!ids.length) return;
    if (MODE === 'demo') { const s = new Set(ids); DEMO[t] = DEMO[t].filter(r => !s.has(r.id)); demoSave(); return; }
    for (let i = 0; i < ids.length; i += 100) { const { error } = await sb.from(t).delete().in('id', ids.slice(i, i + 100)); if (error) throw error; }
  },
  async upsert(t, rows, onConflict = 'id', ignoreDuplicates = false) {
    if (MODE === 'demo') {
      rows.forEach(r => { const i = DEMO[t].findIndex(x => x[onConflict] === r[onConflict]); if (i >= 0) { if (!ignoreDuplicates) DEMO[t][i] = r; } else DEMO[t].push(r); });
      demoSave(); return;
    }
    for (let i = 0; i < rows.length; i += 200) {
      const { error } = await sb.from(t).upsert(rows.slice(i, i + 200), { onConflict, ignoreDuplicates }); if (error) throw error;
    }
  },
  async setSetting(key, value) { await api.upsert('settings', [{ key, value }], 'key'); },
  async log(entity_type, entity_id, entity_label, action, detail = '') {
    try {
      const row = { entity_type, entity_id, entity_label, action, detail };
      if (MODE === 'demo') row.user_email = S.profile?.email || 'demo';
      const [ins] = await api.insert('activity_log', [row]);
      if (ins) S.activity_log.unshift(ins);
    } catch (e) { console.warn('No se pudo registrar el historial', e); }
  },
  async upload(path, file) {
    if (file.size > MAX_FILE) throw new Error(`${file.name}: supera el máximo de 10 MB`);
    if (MODE === 'demo') {
      if (file.size > 1.5 * 1024 * 1024) throw new Error(`${file.name}: en modo demo solo se aceptan archivos de hasta 1,5 MB (con Supabase el límite es 10 MB).`);
      const dataUrl = await readAsDataURL(file); const f = demoFiles(); f[path] = dataUrl;
      try { localStorage.setItem(DEMO_FILES, JSON.stringify(f)); } catch (e) { throw new Error('Sin espacio en el navegador (modo demo).'); }
      return path;
    }
    const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert: false, contentType: file.type || undefined });
    if (error) throw error; return path;
  },
  async fileUrl(path, downloadName) {
    if (MODE === 'demo') {
      const d = demoFiles()[path]; if (!d) throw new Error('Archivo no encontrado');
      const blob = await (await fetch(d)).blob(); return URL.createObjectURL(blob);
    }
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(path, 600, downloadName ? { download: downloadName } : undefined);
    if (error) throw error; return data.signedUrl;
  },
  async removeFile(path) {
    if (MODE === 'demo') { const f = demoFiles(); delete f[path]; localStorage.setItem(DEMO_FILES, JSON.stringify(f)); return; }
    await sb.storage.from(BUCKET).remove([path]);
  },
  async rpc(name, params) {
    if (MODE === 'demo') return DemoRPC[name](params);
    const { data, error } = await sb.rpc(name, params); if (error) throw error; return data;
  },
};

const readyForReport = c => c.status === 'activo' && checklistDone(c) && culOk(c) && (c.report_rating || 'Pendiente') === 'Pendiente';
const isCandStale = c => c.status === 'activo' && daysSince(c.last_moved_at || c.created_at) > staleCandDays();
const isProcStale = p => (p.stage || 1) < 7 && daysSince(p.stage_changed_at || p.created_at) > staleProcDays();

  return { total: cs.length, active: cs.filter(c => c.status === 'activo').length, hired: cs.filter(c => c.status === 'contratado').length, terna: cs.filter(c => c.status === 'activo' && c.phase >= 6).length };
}
function upsertLocal(t, row) { if (!row) return; const i = S[t].findIndex(r => r.id === row.id); if (i >= 0) S[t][i] = row; else S[t].push(row); }
function removeLocal(t, id) { S[t] = S[t].filter(r => r.id !== id); }

async function refresh(t) {
  if (t === 'billing' && !isAdmin()) { S.billing = []; return; }
  if (t === 'profiles') {
    if (!isAdmin()) return;
    S.users = MODE === 'demo' ? JSON.parse(JSON.stringify(DEMO.profiles || [])) : await api.list('profiles');
    return;
  }
  const rows = await api.list(t);
  if (t === 'settings') S.settings = Object.fromEntries(rows.map(r => [r.key, r.value]));
  else S[t] = rows;
}
async function loadAll() {

}

function dragStart(e) {
  if (!canEdit()) { e.preventDefault(); return; }
  const el = e.currentTarget; e.dataTransfer.setData('text/plain', el.dataset.kind + ':' + el.dataset.id);
  e.dataTransfer.effectAllowed = 'move'; el.classList.add('card-dragging');
}
function dragEnd(e) { e.currentTarget.classList.remove('card-dragging'); }
function dragOver(e) { if (!canEdit()) return; e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function dropCard(e) {
  e.preventDefault(); const zone = e.currentTarget; zone.classList.remove('drag-over');
  const [kind, id] = (e.dataTransfer.getData('text/plain') || '').split(':');
  if (!id || kind !== zone.dataset.kind) return;
  const n = +zone.dataset.n;
  if (kind === 'p') moveProcess(id, n); else moveCandidate(id, n);
}
function kanbanCol(kind, n, name, count, cardsHTML, tone = 'sky') {

const docsFor = (type, id) => S.documents.filter(d => d.owner_type === type && d.owner_id === id);
function docIcon(d) { const n = norm(d.name); return n.endsWith('.pdf') ? 'ph-file-pdf text-rose-600' : /\.docx?$/.test(n) ? 'ph-file-doc text-sky-700' : /\.(xlsx?|csv)$/.test(n) ? 'ph-file-xls text-emerald-700' : /\.(png|jpe?g|gif|webp)$/.test(n) ? 'ph-file-image text-purple-600' : 'ph-file text-slate-500'; }
function docListHTML(type, id) {
  const docs = docsFor(type, id);
  if (!docs.length) return '<p class="text-[11px] text-slate-400 italic">Sin archivos adjuntos.</p>';
  return docs.map(d => `<div class="flex items-center justify-between gap-2 p-2 bg-white rounded-lg border border-slate-200 text-xs">
      <span class="flex items-center gap-1.5 text-slate-700 font-medium min-w-0"><i class="ph ${docIcon(d)} text-base shrink-0"></i><span class="truncate" title="${esc(d.name)}">${esc(d.name)}</span></span>
      <span class="flex items-center gap-2 shrink-0 text-[10px] text-slate-400">${fileSize(d.size)} · ${fmtDate(d.created_at)}
        <button type="button" onclick="openDoc('${d.id}')" class="text-sky-700 link-btn" title="Ver"><i class="ph ph-eye"></i> Ver</button>
        <button type="button" onclick="openDoc('${d.id}', true)" class="text-slate-600 link-btn" title="Descargar"><i class="ph ph-download-simple"></i></button>
        <button type="button" onclick="deleteDoc('${d.id}')" class="edit-only text-rose-500 hover:text-rose-700" title="Eliminar"><i class="ph ph-trash"></i></button>
      </span></div>`).join('');
}
async function uploadDocs(owner_type, owner_id, files) {
  let ok = 0;
  for (const f of files) {
    try {
      const path = `${owner_type}/${owner_id}/${Date.now()}_${safeName(f.name)}`;
      await api.upload(path, f);
      const [row] = await api.insert('documents', [{ owner_type, owner_id, name: f.name, path, size: f.size, mime: f.type, uploaded_by: S.profile?.email }]);
      upsertLocal('documents', row); ok++;
    } catch (e) { err(e); }
  }
  if (ok) toast(`${ok} archivo(s) guardado(s)`);
  return ok;
}
async function uploadFromInput(input, type, id) {
  const files = [...input.files]; input.value = ''; if (!files.length) return;
  await uploadDocs(type, id, files); renderAll();
  document.querySelectorAll(`[data-docs="${type}:${id}"]`).forEach(el => el.innerHTML = docListHTML(type, id));
}
async function openDoc(id, download = false) {
  const d = S.documents.find(x => x.id === id); if (!d) return;
  const w = download ? null : window.open('', '_blank');
  try {
    const url = await api.fileUrl(d.path, download ? d.name : null);
    if (download) { const a = document.createElement('a'); a.href = url; a.download = d.name; document.body.appendChild(a); a.click(); a.remove(); }
    else if (w) w.location = url; else window.open(url, '_blank');
  } catch (e) { if (w) w.close(); err(e); }
}
async function deleteDoc(id) {
  const d = S.documents.find(x => x.id === id); if (!d || !confirm(`¿Eliminar el archivo "${d.name}"?`)) return;
  try {
    await api.removeFile(d.path).catch(() => { });
    await api.remove('documents', id); removeLocal('documents', id);
    document.querySelectorAll(`[data-docs="${d.owner_type}:${d.owner_id}"]`).forEach(el => el.innerHTML = docListHTML(d.owner_type, d.owner_id));
    renderAll(); toast('Archivo eliminado');
  } catch (e) { err(e); }
}
async function deleteDocsOf(type, id) {
  for (const d of docsFor(type, id)) { await api.removeFile(d.path).catch(() => { }); await api.remove('documents', d.id).catch(() => { }); removeLocal('documents', d.id); }
}
function historyHTML(entityId, limit = 15) {
  const rows = S.activity_log.filter(l => l.entity_id === entityId).slice(0, limit);

}

async function saveProcess(id) {
  const p = id ? procById(id) : null;
  const row = {
    client: val('p-client'), job_title: val('p-job'), stage: +val('p-stage') || 1, brief_date: val('p-brief') || todayISO(),
    vacancies_count: Math.max(1, parseInt(val('p-vac')) || 1), salary: val('p-salary'), contact_name: val('p-contact'), contact_email: val('p-cemail'),
    schedule: val('p-schedule'), location: val('p-location'), modality: val('p-modality'), contract_type: val('p-contract'), payroll_type: val('p-payroll'),
    payment_freq: val('p-freq'), description: val('p-desc'), requirements: val('p-req'),
    apply_enabled: chk('p-apply'), show_client_public: chk('p-showclient'), client_view_enabled: chk('p-cview'),
  };
  if (!p || p.stage !== row.stage) { row.stage_changed_at = nowISO(); row.closed_at = row.stage === 7 ? (p?.closed_at || todayISO()) : null; }
  await busy('.save-btn', async () => {
    let saved;
    if (p) {
      saved = await api.update('processes', p.id, row);
      await api.log('process', p.id, `${row.client} · ${row.job_title}`, p.stage !== row.stage ? 'Cambio de etapa' : 'Actualización', p.stage !== row.stage ? `${stages()[p.stage - 1]} → ${stages()[row.stage - 1]}` : 'Datos del proceso editados');
    } else {
      [saved] = await api.insert('processes', [row]);
      await api.log('process', saved.id, `${row.client} · ${row.job_title}`, 'Creación', `Etapa: ${stages()[row.stage - 1]}`);
    }
    upsertLocal('processes', saved);
    if (isAdmin()) {
      const cost = parseFloat(val('p-cost')) || 0, status = val('p-bstatus');
      const bill = S.billing.find(b => b.process_id === saved.id);
      const bRow = { process_id: saved.id, client: row.client, service: row.job_title, contact: row.contact_name || null, cost, percent: parseFloat(val('p-pct')) || 0, status, invoice_number: val('p-inv') || null, paid_at: status === 'Pagado' ? (bill?.paid_at || todayISO()) : null };
      if (bill) upsertLocal('billing', await api.update('billing', bill.id, bRow));
      else if (cost > 0) { const [b] = await api.insert('billing', [bRow]); upsertLocal('billing', b); }
    }
    closeTopModal(); renderAll(); toast(p ? 'Proceso actualizado' : 'Proceso creado');
    if (!p && (row.apply_enabled || row.client_view_enabled)) openProcessModal(saved.id); // muestra los enlaces generados
  });
}
async function deleteProcess(id) {
  const p = procById(id); if (!p) return;
  const n = S.candidates.filter(c => c.process_id === id).length;
  if (!confirm(`¿Eliminar el proceso "${p.job_title}" (${p.client})?\n\n${n ? `Sus ${n} candidato(s) se conservan, pero quedarán sin proceso asignado.\n` : ''}Los archivos del expediente se eliminarán.`)) return;
  try {
    await deleteDocsOf('process', id);
    await api.remove('processes', id); removeLocal('processes', id);
    if (MODE === 'demo') { DEMO.candidates.forEach(c => { if (c.process_id === id) c.process_id = null; }); DEMO.billing.forEach(b => { if (b.process_id === id) b.process_id = null; }); demoSave(); }
    S.candidates.forEach(c => { if (c.process_id === id) c.process_id = null; });
    S.billing.forEach(b => { if (b.process_id === id) b.process_id = null; });
    await api.log('process', id, `${p.client} · ${p.job_title}`, 'Eliminación', 'Proceso eliminado');
    renderAll(); toast('Proceso eliminado');
  } catch (e) { err(e); }
}

// --- Días hábiles en Perú (sin sábados, domingos ni feriados nacionales) ---
function easterDate(y) {

  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);

  const deadline = addBusinessDays(start, AV_DAYS);
  if (ck.decision?.at) {
    const used = businessDaysBetween(start, String(ck.decision.at).slice(0, 10));

}

let XLSX_PROMISE = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  XLSX_PROMISE = XLSX_PROMISE || new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = () => res(window.XLSX); s.onerror = () => { XLSX_PROMISE = null; rej(new Error('No se pudo cargar el lector de Excel. Revisa tu conexión.')); };
    document.head.appendChild(s);
  });
  return XLSX_PROMISE;
}
const IMPORT_FIELDS = [['', '— Ignorar —'], ['name', 'Nombre completo'], ['dni', 'DNI'], ['job_title', 'Puesto'], ['client', 'Cliente / Empresa'], ['birthdate', 'Fecha de nacimiento'], ['email', 'Correo'], ['phone', 'Teléfono'], ['phase', 'Fase'], ['cul', 'CUL'], ['sunedu', 'SUNEDU'], ['notes', 'Observaciones'], ['created_at', 'Fecha de ingreso'], ['linkedin', 'LinkedIn'], ['salary_expectation', 'Pretensión salarial']];
function guessField(h) {
  const n = norm(h).replace(/[_\-.]+/g, ' ');
  if (/nacim/.test(n)) return 'birthdate';
  if (/cliente|empresa/.test(n)) return 'client';
  if (/nombre|candidato|postulante|apellido/.test(n)) return 'name';
  if (/\bdni\b|documento|\bce\b/.test(n)) return 'dni';
  if (/puesto|cargo|vacante|posicion/.test(n)) return 'job_title';
  if (/correo|mail/.test(n)) return 'email';
  if (/telef|celular|movil|whatsapp/.test(n)) return 'phone';
  if (/^fase|^etapa/.test(n)) return 'phase';
  if (/\bcul\b|antecedente/.test(n)) return 'cul';
  if (/sunedu|grado/.test(n)) return 'sunedu';
  if (/observ|nota|comentario/.test(n)) return 'notes';
  if (/linkedin/.test(n)) return 'linkedin';
  if (/pretension|salari|sueldo/.test(n)) return 'salary_expectation';
  if (/fecha|ingreso|registro/.test(n)) return 'created_at';
  return '';
}
function parseDateAny(v) {
  if (v === null || v === undefined || v === '') return null;
  if (v instanceof Date) { const d = new Date(v.getTime() + 12 * 3600e3); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
  if (typeof v === 'number' && v > 10000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return d.toISOString().slice(0, 10); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  return null;
}
function parsePhase(v) {
  if (v === '' || v == null) return 1;
  const m = String(v).match(/\d+/); if (m) return Math.min(7, Math.max(1, +m[0]));
  const i = phases().findIndex(p => norm(p) === norm(v)); return i >= 0 ? i + 1 : 1;
}

async function runImport() {

      ${kpiTile('Time-to-Hire promedio', avg === null ? '—' : `${avg} días`, tth.length ? `mín. ${Math.min(...tth.map(x => x.days))} · máx. ${Math.max(...tth.map(x => x.days))} días` : 'Brief → contratación', 'text-slate-900', 'timer')}
      ${kpiTile('Procesos sin movimiento', staleP.length, `más de ${staleProcDays()} días en la misma etapa`, staleP.length ? 'text-amber-700' : 'text-slate-900', 'warning')}
      ${kpiTile('Candidatos sin movimiento', staleC.length, `más de ${staleCandDays()} días en la misma fase`, staleC.length ? 'text-amber-700' : 'text-slate-900', 'warning')}
    </div>
    <div class="grid lg:grid-cols-3 gap-4">
      <div class="panel p-4 lg:col-span-2 space-y-2">
        <h3 class="font-bold text-sm text-slate-900">Tasa de conversión por fase</h3>
        <p class="text-[11px] text-slate-500">Postulantes que llegaron a cada fase · % respecto de la fase anterior · cuántos están hoy en esa fase.</p>
        <div class="space-y-1.5 pt-1">${cs.length ? funnel : '<p class="text-slate-400 text-xs">Sin datos todavía.</p>'}</div>
        ${cs.length ? `<p class="text-[11px] text-emerald-700 font-semibold pt-1"><i class="ph-bold ph-seal-check"></i> Contratados: ${hired.length} (${pct(hired.length, cs.length)}% del total de postulantes)</p>` : ''}
      </div>
      <div class="panel p-4 space-y-3">
        <div><h3 class="font-bold text-sm text-slate-900 mb-1">Procesos por etapa</h3>
          ${st.map((s, i) => { const n = procs.filter(p => p.stage === i + 1).length; return `<div class="flex justify-between text-[11px] py-0.5 border-b border-slate-50"><span class="text-slate-600">${i + 1}. ${esc(s)}</span><strong>${n}</strong></div>`; }).join('')}</div>
        <div><h3 class="font-bold text-sm text-slate-900 mb-1">Origen de postulantes</h3>
          ${Object.entries(sources).map(([k, n]) => `<div class="flex justify-between text-[11px] py-0.5"><span class="text-slate-600 capitalize">${esc(k)}</span><strong>${n}</strong></div>`).join('') || '<p class="text-[11px] text-slate-400">—</p>'}</div>
        <div><h3 class="font-bold text-sm text-slate-900 mb-1">Motivos de descarte</h3>

      </div>
    </div>
    <div class="grid lg:grid-cols-2 gap-4">
      <div class="panel p-4">
        <h3 class="font-bold text-sm text-slate-900 mb-2 flex items-center gap-1.5"><i class="ph-bold ph-warning text-amber-600"></i> Alertas: sin movimiento</h3>
        ${staleP.length || staleC.length ? `<ul class="divide-y divide-slate-100 text-[11px]">
          ${staleP.map(p => `<li class="py-1.5 flex justify-between gap-2"><button onclick="openProcessModal('${p.id}')" class="text-left hover:text-sky-700"><i class="ph ph-briefcase"></i> <strong>${esc(p.job_title)}</strong> · ${esc(p.client)} <span class="text-slate-500">(${esc(st[p.stage - 1])})</span></button><span class="text-amber-700 font-bold shrink-0">${daysSince(p.stage_changed_at)} días</span></li>`).join('')}
          ${staleC.map(c => `<li class="py-1.5 flex justify-between gap-2"><button onclick="openCandidateModal('${c.id}')" class="text-left hover:text-sky-700"><i class="ph ph-user"></i> <strong>${esc(c.name)}</strong> · ${esc(candLabel(c).job)} <span class="text-slate-500">(${esc(ph[c.phase - 1])})</span></button><span class="text-amber-700 font-bold shrink-0">${daysSince(c.last_moved_at)} días</span></li>`).join('')}
        </ul>` : '<p class="text-[11px] text-emerald-700"><i class="ph-bold ph-check-circle"></i> Todo al día.</p>'}

async function toggleBill(id) {
  const b = S.billing.find(x => x.id === id); if (!b) return;
  const status = b.status === 'Pagado' ? 'Pendiente' : 'Pagado';
  try { upsertLocal('billing', await api.update('billing', id, { status, paid_at: status === 'Pagado' ? todayISO() : null })); renderFinanzas(); } catch (e) { err(e); }
}
function openBillModal(id) {
  const b = id ? S.billing.find(x => x.id === id) : null;
  const procOpts = `<option value="">— Cobro independiente —</option>` + S.processes.map(p => `<option value="${p.id}" ${b?.process_id === p.id ? 'selected' : ''}>${esc(p.client)} · ${esc(p.job_title)}</option>`).join('');
  openModal({
    title: b ? `Editar cobro (${esc(b.client)})` : 'Registrar cobro', size: 'max-w-lg',
    body: `<form id="f-bill" onsubmit="event.preventDefault(); saveBill('${b?.id || ''}')" class="space-y-3">
      ${fSelect('b-proc', 'Proceso vinculado (opcional)', [], '', { raw: procOpts })}
      ${fInput('b-client', 'Empresa cliente', b?.client, { req: 1 })}${fInput('b-service', 'Servicio / vacante', b?.service)}${fInput('b-contact', 'Contacto de pagos', b?.contact)}
      <div class="grid grid-cols-2 gap-3">${fInput('b-cost', 'Costo total (S/)', b?.cost ?? '', { type: 'number', req: 1, attrs: 'min="0" step="0.01"' })}${fInput('b-pct', '% comisión', b?.percent ?? 20, { type: 'number', req: 1, attrs: 'min="0" max="100" step="0.1"' })}</div>
      <div class="grid grid-cols-3 gap-3">${fSelect('b-status', 'Estado', [['Pendiente', 'Pendiente ⏳'], ['Pagado', 'Pagado ✓']], b?.status || 'Pendiente')}${fInput('b-paid', 'Fecha de pago', b?.paid_at || '', { type: 'date' })}${fInput('b-inv', 'N.º factura / RxH', b?.invoice_number)}</div>
    </form>`,
    footer: `<button data-close class="btn btn-ghost">Cancelar</button><button type="submit" form="f-bill" class="btn btn-green save-btn">Guardar</button>`,
  });
}
async function saveBill(id) {
  const status = val('b-status');
  const row = { process_id: val('b-proc') || null, client: val('b-client'), service: val('b-service'), contact: val('b-contact'), cost: parseFloat(val('b-cost')) || 0, percent: parseFloat(val('b-pct')) || 0, status, paid_at: status === 'Pagado' ? (val('b-paid') || todayISO()) : null, invoice_number: val('b-inv') || null };
  await busy('.save-btn', async () => {
    if (id) upsertLocal('billing', await api.update('billing', id, row)); else { const [b] = await api.insert('billing', [row]); upsertLocal('billing', b); }
    closeTopModal(); renderFinanzas(); toast('Cobro guardado');
  });
}
async function deleteBill(id) {
  if (!confirm('¿Eliminar este registro de cobro?')) return;
  try { await api.remove('billing', id); removeLocal('billing', id); renderFinanzas(); } catch (e) { err(e); }
}

async function saveLib(t, id) {

    let saved;
    if (id) saved = await api.update(t, id, row); else [saved] = await api.insert(t, [row]);

  });
}

function resetDemo() {

}
const BACKUP_TABLES = ['settings', 'competencies', 'dynamics', 'templates', 'processes', 'candidates', 'billing', 'documents', 'activity_log'];
async function exportBackup() {
  try {
    const tables = {};
    for (const t of BACKUP_TABLES) tables[t] = await api.list(t);
    const blob = new Blob([JSON.stringify({ app: 'TalentHub', version: 2, exported_at: nowISO(), exported_by: S.profile?.email, tables }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Respaldo_TalentHub_${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove();
    toast('Respaldo descargado');
  } catch (e) { err(e); }
}
function openRestoreModal() {
  openModal({
    title: 'Restaurar respaldo', subtitle: 'Reemplaza TODA la información actual por la del archivo .json.', size: 'max-w-lg',
    body: `<div class="space-y-3"><div class="bg-rose-50 border border-rose-200 text-rose-800 rounded-lg p-3"><i class="ph-bold ph-warning"></i> Los registros que no estén en el respaldo se eliminarán. Te recomendamos exportar un respaldo actual antes de continuar.</div>
      <input id="r-file" type="file" accept=".json,application/json" class="block text-xs">${fInput('r-confirm', 'Escribe RESTAURAR para confirmar', '', { ph: 'RESTAURAR' })}</div>`,
    footer: `<button data-close class="btn btn-ghost">Cancelar</button><button onclick="restoreBackup()" class="btn btn-dark save-btn"><i class="ph ph-upload-simple"></i> Restaurar</button>`,
  });
}
async function restoreBackup() {
  const f = $('r-file').files[0];
  if (!f) return toast('Selecciona un archivo .json', 'warn');
  if (val('r-confirm').toUpperCase() !== 'RESTAURAR') return toast('Escribe RESTAURAR para confirmar', 'warn');
  await busy('.save-btn', async () => {
    let data; try { data = JSON.parse(await f.text()); } catch (e) { throw new Error('El archivo no es un JSON válido'); }
    if (data?.app !== 'TalentHub' || !data.tables) throw new Error('El archivo no es un respaldo de TalentHub');
    const T = data.tables;
    if (MODE === 'demo') {
      BACKUP_TABLES.forEach(t => { if (Array.isArray(T[t])) DEMO[t] = T[t]; }); demoSave();
    } else {
      for (const t of BACKUP_TABLES) {
        const rows = T[t] || []; if (!rows.length) continue;
        if (t === 'settings') await api.upsert(t, rows, 'key');
        else if (t === 'activity_log') await api.upsert(t, rows, 'id', true);
        else await api.upsert(t, rows, 'id');
      }
      for (const t of [...BACKUP_TABLES].reverse()) {
        if (['settings', 'activity_log'].includes(t) || !Array.isArray(T[t])) continue;
        const keep = new Set(T[t].map(r => r.id));
        await api.removeMany(t, (await api.list(t)).filter(r => !keep.has(r.id)).map(r => r.id));
      }
    }
    await loadAll(); closeTopModal(); renderAll(); toast('Respaldo restaurado correctamente');
  });
}

  const btn = $('a-btn'); btn.disabled = true; btn.innerHTML = '<i class="ph ph-circle-notch animate-spin"></i> Enviando…';
  try {
    const meta = [];
    for (const f of files) {
      const path = `postulaciones/${token}/${uid()}/${safeName(f.name)}`;
      await api.upload(path, f); meta.push({ name: f.name, path, size: f.size, mime: f.type });

function showAuth(mode = 'login', msg = '') {
  showScreen('screen-auth');
  const note = msg ? `<div class="bg-sky-50 border border-sky-200 text-sky-900 rounded-lg p-2.5 text-xs">${msg}</div>` : '';
  const views = {
    login: `<form onsubmit="event.preventDefault(); doLogin()" class="space-y-3 text-xs">${note}
      ${fInput('au-email', 'Correo', '', { type: 'email', req: 1, attrs: 'autocomplete="email"' })}${fInput('au-pass', 'Contraseña', '', { type: 'password', req: 1, attrs: 'autocomplete="current-password"' })}
      <button class="btn btn-primary w-full py-2 auth-btn">Ingresar</button>
      <div class="flex justify-between text-[11px]"><button type="button" onclick="showAuth('signup')" class="text-sky-700 hover:underline">Crear cuenta</button><button type="button" onclick="showAuth('forgot')" class="text-slate-500 hover:underline">Olvidé mi contraseña</button></div></form>`,
    signup: `<form onsubmit="event.preventDefault(); doSignup()" class="space-y-3 text-xs">${note}
      ${fInput('au-name', 'Nombre completo', '', { req: 1 })}${fInput('au-email', 'Correo', '', { type: 'email', req: 1 })}${fInput('au-pass', 'Contraseña (mín. 8 caracteres)', '', { type: 'password', req: 1, attrs: 'minlength="8" autocomplete="new-password"' })}
      <button class="btn btn-primary w-full py-2 auth-btn">Crear cuenta</button>
      <p class="text-[11px] text-slate-500">Tras confirmar tu correo, la administradora debe aprobar tu acceso.</p>
      <button type="button" onclick="showAuth('login')" class="text-[11px] text-sky-700 hover:underline">← Volver</button></form>`,
    forgot: `<form onsubmit="event.preventDefault(); doForgot()" class="space-y-3 text-xs">${note}${fInput('au-email', 'Correo', '', { type: 'email', req: 1 })}
      <button class="btn btn-primary w-full py-2 auth-btn">Enviar enlace de recuperación</button><button type="button" onclick="showAuth('login')" class="text-[11px] text-sky-700 hover:underline">← Volver</button></form>`,
    reset: `<form onsubmit="event.preventDefault(); doReset()" class="space-y-3 text-xs">${note}<p class="font-semibold text-slate-700">Crea tu nueva contraseña</p>
      ${fInput('au-pass', 'Nueva contraseña (mín. 8 caracteres)', '', { type: 'password', req: 1, attrs: 'minlength="8" autocomplete="new-password"' })}<button class="btn btn-primary w-full py-2 auth-btn">Guardar contraseña</button></form>`,
    pending: `<div class="space-y-3 text-xs">${note}<div class="bg-amber-50 border border-amber-200 text-amber-900 rounded-lg p-3"><i class="ph-bold ph-hourglass"></i> Tu cuenta <strong>${esc(S.pendingEmail || '')}</strong> está pendiente de aprobación. Pide a la administradora que te asigne un rol.</div>
      <button onclick="S.started=false; checkSession()" class="btn btn-primary w-full">Volver a comprobar</button><button onclick="logout()" class="btn btn-ghost w-full">Cerrar sesión</button></div>`,
  };
  $('auth-box').innerHTML = views[mode] || views.login;
}
async function doLogin() {
  await busy('.auth-btn', async () => {
    const { error } = await sb.auth.signInWithPassword({ email: val('au-email'), password: $('au-pass').value });
    if (error) throw new Error(error.message === 'Invalid login credentials' ? 'Correo o contraseña incorrectos' : error.message);
    await checkSession();
  });
}
async function doSignup() {
  await busy('.auth-btn', async () => {
    const { data, error } = await sb.auth.signUp({ email: val('au-email'), password: $('au-pass').value, options: { data: { full_name: val('au-name') }, emailRedirectTo: baseURL() } });
    if (error) throw error;
    if (data.session) await checkSession();
    else showAuth('login', 'Cuenta creada. Revisa tu correo y haz clic en el enlace de confirmación; luego ingresa aquí.');
  });
}
async function doForgot() {
  await busy('.auth-btn', async () => {
    const { error } = await sb.auth.resetPasswordForEmail(val('au-email'), { redirectTo: baseURL() }); if (error) throw error;
    showAuth('login', 'Te enviamos un correo con el enlace para crear una nueva contraseña.');
  });
}
async function doReset() {
  await busy('.auth-btn', async () => {
    const { error } = await sb.auth.updateUser({ password: $('au-pass').value }); if (error) throw error;
    S.recovering = false; history.replaceState(null, '', baseURL()); toast('Contraseña actualizada'); await checkSession();
  });
}
async function logout() {
  if (MODE === 'demo') { toast('En modo demo no hay sesión que cerrar.', 'warn'); return; }
  await sb.auth.signOut(); location.href = baseURL();
}
async function checkSession() {
  if (S.started || S.recovering) return;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showAuth('login');
  const { data: prof, error } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (error) { err(error); return showAuth('login'); }
  S.pendingEmail = session.user.email;
  if (!prof || prof.role === 'pendiente') return showAuth('pending');
  S.profile = prof; await startApp();
}
function renderDemoBanner() {
  const b = $('demo-banner'); if (MODE !== 'demo') return;
  b.classList.remove('hidden');
  b.innerHTML = `<div class="flex flex-wrap items-center justify-between gap-2"><span><i class="ph-bold ph-flask"></i> <strong>Modo demostración:</strong> los datos se guardan solo en este navegador. Para usarlo en varias computadoras con usuarios, configura Supabase (ver guía).</span>
    <label class="flex items-center gap-1.5 font-semibold">Ver como:<select onchange="setDemoRole(this.value)" class="border border-amber-300 rounded px-1.5 py-0.5 bg-white">${opts([['admin', 'Administradora'], ['editor', 'Editor'], ['lector', 'Solo lectura (jefe)']], S.profile.role)}</select></label></div>`;
}
async function setDemoRole(r) {
  try { localStorage.setItem('th_demo_role', r); } catch (e) { }
  const p = (DEMO.profiles || []).find(x => x.role === r) || {};
  S.profile = { id: p.id || 'demo', email: p.email || 'demo@local', full_name: p.full_name || 'Demo', role: r };
  await loadAll(); switchTab(S.tab);
}
async function startApp() {
  if (S.started) return; S.started = true;
  showScreen('screen-app'); renderDemoBanner();
  $('sec-procesos').innerHTML = '<div class="p-10 text-center text-slate-500 text-sm"><i class="ph ph-circle-notch animate-spin"></i> Cargando datos…</div>';
  await loadAll();
  let tab = 'procesos'; try { tab = localStorage.getItem('th_tab') || 'procesos'; } catch (e) { }
  switchTab(tab);
  if (sb) subscribeRealtime();
}
function subscribeRealtime() {
  const pending = new Set();
  const flush = debounce(async () => {
    const ts = [...pending]; pending.clear();
    await Promise.all(ts.map(t => refresh(t).catch(() => { })));
    renderAll();
  }, 600);
  sb.channel('talenthub-db').on('postgres_changes', { event: '*', schema: 'public' }, payload => { pending.add(payload.table); flush(); }).subscribe();
}
async function boot() {
  const params = new URLSearchParams(location.search);
  if (MODE === 'demo') demoLoad();
  if (MODE === 'cloud' && !sb) { showScreen('screen-auth'); $('auth-box').innerHTML = '<p class="text-rose-600 text-xs">No se pudo cargar la librería de Supabase. Revisa tu conexión a internet.</p>'; return; }
  if (params.get('postular')) return renderApplyPage(params.get('postular'));
  if (params.get('cliente')) return renderClientPage(params.get('cliente'));
  if (MODE === 'demo') {
    let r = 'admin'; try { r = localStorage.getItem('th_demo_role') || 'admin'; } catch (e) { }
    const p = (DEMO.profiles || []).find(x => x.role === r) || { id: 'demo', email: 'adriana@demo.local', full_name: 'Adriana Olivos' };
    S.profile = { id: p.id, email: p.email, full_name: p.full_name, role: r };
    return startApp();
  }
  S.recovering = /type=recovery/.test(INITIAL_HASH);
  sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') { S.recovering = true; setTimeout(() => showAuth('reset'), 0); }
    else if (event === 'SIGNED_OUT') { S.started = false; setTimeout(() => showAuth('login'), 0); }
  });
  if (S.recovering) return showAuth('reset');
  await checkSession();
}
window.addEventListener('DOMContentLoaded', () => { boot().catch(e => { err(e); showScreen('screen-auth'); }); });

</script>
</body>
</html>
