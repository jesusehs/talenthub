# Mantiene activo el proyecto de Supabase (el plan gratuito se pausa tras 7 días sin uso).
# Cada 3 horas hace una consulta que solo LEE una tabla (devuelve "ok"); no guarda nada en la base de datos.
# Una vez al mes actualiza .github/keepalive.txt (una sola línea) para que GitHub no apague esta tarea.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 */3 * * *'  # cada 3 horas (8 veces al día)
  workflow_dispatch:         # permite ejecutarla a mano

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          curl -fsS -X POST "https://nybzgiesrscdikclfvvd.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_4MHM8aOntYpFs7xCO0YYyA_ZD3lQltw" \
            -H "Content-Type: application/json" -d '{}'

      - uses: actions/checkout@v4

      - name: Registro mensual (evita que GitHub apague la tarea)
        run: |
          date -u +%Y-%m > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --cached --quiet || (git commit -m "Verificación mensual de Supabase" && git push)
